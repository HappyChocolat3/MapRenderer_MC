name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install WebAssembly toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 wasi-libc libclang-rt-18-dev-wasm32

      - name: Build cubiomes.wasm
        run: CC=clang-18 PATH="/usr/lib/llvm-18/bin:$PATH" ./wasm/build.sh

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
